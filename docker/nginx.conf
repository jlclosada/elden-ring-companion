server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Los assets llevan hash en el nombre: caché larga
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Estudio: proxy hacia ComfyUI en el equipo anfitrión (HTTP + WebSocket). Se borra Origin porque
  # ComfyUI rechaza las peticiones cuyo origen no coincide con su host.
  location /comfy/ {
    proxy_pass http://host.docker.internal:8188/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host 127.0.0.1:8188;
    proxy_set_header Origin "";
    proxy_read_timeout 1h;
    client_max_body_size 50m;
  }

  # SPA: cualquier ruta (/mapa, /builds/…) sirve index.html
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
