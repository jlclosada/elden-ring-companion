services:
  # Producción: build optimizado servido por nginx → http://localhost:8090 (cambia el puerto con WEB_PORT)
  web:
    build:
      context: .
      target: prod
    image: sendero-de-gracia:latest
    ports:
      - "${WEB_PORT:-8090}:80"
    restart: unless-stopped

  # Desarrollo con recarga en caliente → http://localhost:5173
  # docker compose --profile dev up dev
  dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    ports:
      - "${DEV_PORT:-5173}:5173"
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  # Regenerar el compendio (Fan API + wiki, incluido el DLC)
  # docker compose --profile tools run --rm data
  data:
    profiles: ["tools"]
    build:
      context: .
      target: deps
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    command: ["node", "scripts/fetch-data.mjs"]
